<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>取餐叫號系統 - 後台控制</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { text-align: center; color: #333; }
        .control-panel, .section-box {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .tag-group {
            margin-bottom: 12px;
        }
        .tag-btn {
            background-color: #6c757d;
            font-size: 0.9rem;
            padding: 6px 12px;
            margin-right: 5px;
            margin-bottom: 5px;
        }
        .tag-btn:hover { background-color: #5a6268; }

        input, button, textarea {
            padding: 10px;
            font-size: 1rem;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        button {
            cursor: pointer;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover { background-color: #0056b3; }
        ul { list-style: none; padding: 0; }
        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f9f9f9;
            padding: 10px 15px;
            border-bottom: 1px solid #ddd;
            margin-bottom: 5px;
            border-radius: 4px;
        }
        .btn-move { background-color: #28a745; }
        .btn-move:hover { background-color: #218838; }
        .btn-delete { background-color: #dc3545; }
        .btn-delete:hover { background-color: #c82333; }
        .btn-add30 { background-color: #17a2b8; padding: 6px 10px; font-size: 0.9rem; }
        .btn-add30:hover { background-color: #138496; }
        .countdown-info {
            color: #d9534f;
            font-weight: bold;
            font-size: 0.9rem;
            margin-left: 10px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-box {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            width: 350px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .modal-box h3 {
            margin-top: 0;
            color: #333;
            font-size: 1.3rem;
        }
        .modal-box p {
            color: #666;
            margin-bottom: 25px;
            font-size: 1.1rem;
        }
        .slide-track {
            position: relative;
            background: #e9ecef;
            height: 50px;
            border-radius: 25px;
            margin-bottom: 15px;
            overflow: hidden;
            user-select: none;
        }
        .slide-text {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #495057;
            font-weight: bold;
            font-size: 0.95rem;
            pointer-events: none;
        }
        .slide-thumb {
            position: absolute;
            left: 0;
            top: 0;
            width: 50px;
            height: 50px;
            background: #28a745;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .slide-thumb:hover { background: #218838; }
        .btn-cancel {
            background-color: #6c757d;
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border-radius: 6px;
        }
        .btn-cancel:hover { background-color: #5a6268; }
    </style>
</head>
<body>

    <h1>後台控制面板</h1>

    <div class="control-panel">
        <h3>螢幕與語音設定</h3>
        <div style="margin-bottom: 10px;">
            <label style="display:inline-block; width: 100px; font-weight:bold;">店名字幕：</label>
            <input type="text" id="inputStoreName" placeholder="例如：OO手作早午餐" style="width: 320px;" oninput="updateSettings()">
        </div>
        <div style="margin-bottom: 10px;">
            <label style="display:inline-block; width: 100px; font-weight:bold;">跑馬燈公告：</label>
            <input type="text" id="inputMarquee" placeholder="例如：今日特餐已售完！" style="width: 320px;" oninput="updateSettings()">
        </div>
        <div style="margin-bottom: 10px; display: flex; align-items: center;">
            <label style="display:inline-block; width: 100px; font-weight:bold;">語音播報：</label>
            <input type="checkbox" id="inputVoiceEnabled" style="width: 20px; height: 20px; vertical-align: middle; margin-right: 10px;" onchange="updateSettings()"> 
            <span>啟動前台語音叫號</span>
        </div>
        <div style="margin-bottom: 10px;">
            <label style="display:inline-block; width: 100px; font-weight:bold;">語音格式：</label>
            <input type="text" id="inputVoiceTemplate" value="請{{number}}顧客取餐，謝謝" style="width: 320px;" oninput="updateSettings()">
            <span style="font-size: 0.85rem; color: #666;">({{number}} 中的數字會自動加逗號唸出)</span>
        </div>
        <div>
            <label style="display:inline-block; width: 100px; font-weight:bold;">語音語速：</label>
            <input type="number" id="inputVoiceRate" value="1.0" min="0.5" max="2.0" step="0.1" style="width: 100px;" oninput="updateSettings()">
            <span style="font-size: 0.85rem; color: #666;">(範圍 0.5 ~ 2.0，預設 1.0)</span>
        </div>
    </div>

    <div class="control-panel">
        <h3>新增準備中號碼</h3>
        <div class="tag-group">
            <button type="button" class="tag-btn" onclick="insertTag('自取-')">自取</button>
            <button type="button" class="tag-btn" onclick="insertTag('網路-')">網路</button>
            <button type="button" class="tag-btn" onclick="insertTag('電話-')">電話</button>
            <button type="button" class="tag-btn" onclick="insertTag('Foodpanda-')">Foodpanda</button>
            <button type="button" class="tag-btn" onclick="insertTag('Uber eats-')">Uber eats</button>
        </div>

        <input type="text" id="inputNumber" placeholder="請輸入或點選上方選項..." style="width: 220px;">
        <input type="number" id="inputTime" placeholder="預估製作分" value="5" style="width: 100px;">
        <button onclick="addPreparing()">新增號碼</button>
    </div>

    <div class="section-box">
        <h3>準備中清單</h3>
        <ul id="adminPrepList"></ul>
    </div>

    <div class="section-box">
        <h3>請取餐清單 (自動倒數消失)</h3>
        <ul id="adminReadyList"></ul>
    </div>

    <div class="modal-overlay" id="confirmModal">
        <div class="modal-box">
            <h3>確認叫號</h3>
            <p id="modalMessage">訂單號碼確認完成</p>
            
            <div class="slide-track" id="slideTrack">
                <div class="slide-text">滑動以確認取餐 ➔</div>
                <div class="slide-thumb" id="slideThumb">➔</div>
            </div>

            <button class="btn-cancel" onclick="closeModal()">取消</button>
        </div>
    </div>

    <script>
        let currentTargetIndex = null;

        function insertTag(text) {
            const numInput = document.getElementById('inputNumber');
            numInput.value = text;
            numInput.focus();
        }

        function getData() {
            let data = JSON.parse(localStorage.getItem('queueData'));
            if (!data) {
                data = { 
                    ready: [], 
                    preparing: [], 
                    storeName: '', 
                    marquee: '', 
                    voiceEnabled: true, 
                    voiceTemplate: '請{{number}}顧客取餐，謝謝',
                    voiceRate: 1.0
                };
            }
            if (data.voiceEnabled === undefined) data.voiceEnabled = true;
            if (!data.voiceTemplate) data.voiceTemplate = '請{{number}}顧客取餐，謝謝';
            if (data.voiceRate === undefined) data.voiceRate = 1.0;
            return data;
        }

        function saveData(data) {
            localStorage.setItem('queueData', JSON.stringify(data));
            renderAdmin();
        }

        function updateSettings() {
            const data = getData();
            data.storeName = document.getElementById('inputStoreName').value;
            data.marquee = document.getElementById('inputMarquee').value;
            data.voiceEnabled = document.getElementById('inputVoiceEnabled').checked;
            data.voiceTemplate = document.getElementById('inputVoiceTemplate').value;
            data.voiceRate = parseFloat(document.getElementById('inputVoiceRate').value) || 1.0;
            localStorage.setItem('queueData', JSON.stringify(data));
        }

        function addPreparing() {
            const numInput = document.getElementById('inputNumber');
            const timeInput = document.getElementById('inputTime');
            const number = numInput.value.trim();
            const time = timeInput.value.trim();

            if (!number) {
                alert('請輸入號碼或名稱！');
                return;
            }

            const data = getData();
            data.preparing.push({ number, time });
            saveData(data);

            numInput.value = '';
            numInput.focus();
        }

        function openConfirmModal(index) {
            const data = getData();
            const item = data.preparing[index];
            currentTargetIndex = index;

            document.getElementById('modalMessage').innerText = `訂單 ${item.number} 確認完成`;
            document.getElementById('confirmModal').style.display = 'flex';
            resetSlider();
        }

        function closeModal() {
            document.getElementById('confirmModal').style.display = 'none';
            currentTargetIndex = null;
        }

        function confirmMoveToReady() {
            if (currentTargetIndex === null) return;
            const data = getData();
            const item = data.preparing.splice(currentTargetIndex, 1)[0];
            
            let defaultSeconds = 60;
            data.ready.push({
                number: item.number,
                expireTime: Date.now() + defaultSeconds * 1000,
                totalSeconds: defaultSeconds
            });
            saveData(data);
            closeModal();
        }

        function updateReadyTime(index, newMin) {
            const data = getData();
            const secs = Number(newMin) * 60;
            data.ready[index].expireTime = Date.now() + secs * 1000;
            data.ready[index].totalSeconds = secs;
            saveData(data);
        }

        function add30Seconds(index) {
            const data = getData();
            const now = Date.now();
            if (data.ready[index].expireTime < now) {
                data.ready[index].expireTime = now + 30 * 1000;
            } else {
                data.ready[index].expireTime += 30 * 1000;
            }
            data.ready[index].totalSeconds = Math.max(0, (data.ready[index].expireTime - now) / 1000);
            saveData(data);
        }

        function deletePrep(index) {
            const data = getData();
            data.preparing.splice(index, 1);
            saveData(data);
        }

        function deleteReady(index) {
            const data = getData();
            data.ready.splice(index, 1);
            saveData(data);
        }

        function renderAdmin() {
            const data = getData();

            if(document.activeElement !== document.getElementById('inputStoreName')) {
                document.getElementById('inputStoreName').value = data.storeName || '';
            }
            if(document.activeElement !== document.getElementById('inputMarquee')) {
                document.getElementById('inputMarquee').value = data.marquee || '';
            }
            document.getElementById('inputVoiceEnabled').checked = data.voiceEnabled;
            if(document.activeElement !== document.getElementById('inputVoiceTemplate')) {
                document.getElementById('inputVoiceTemplate').value = data.voiceTemplate || '請{{number}}顧客取餐，謝謝';
            }
            if(document.activeElement !== document.getElementById('inputVoiceRate')) {
                document.getElementById('inputVoiceRate').value = data.voiceRate !== undefined ? data.voiceRate : 1.0;
            }

            const prepUl = document.getElementById('adminPrepList');
            prepUl.innerHTML = '';
            data.preparing.forEach((item, index) => {
                prepUl.innerHTML += `
                    <li>
                        <span><b>${item.number}</b> (耗時: ${item.time}分)</span>
                        <div>
                            <button class="btn-move" onclick="openConfirmModal(${index})">移至請取餐</button>
                            <button class="btn-delete" onclick="deletePrep(${index})">刪除</button>
                        </div>
                    </li>
                `;
            });

            const readyUl = document.getElementById('adminReadyList');
            readyUl.innerHTML = '';
            const now = Date.now();

            data.ready.forEach((item, index) => {
                const remainingSecs = Math.max(0, Math.ceil((item.expireTime - now) / 1000));
                const mins = Math.floor(remainingSecs / 60);
                const secs = remainingSecs % 60;
                const currentMinSetting = Math.round(item.totalSeconds / 60);

                readyUl.innerHTML += `
                    <li>
                        <div>
                            <b>${item.number}</b>
                            <span class="countdown-info">剩餘: ${mins}分${secs < 10 ? '0' : ''}${secs}秒</span>
                        </div>
                        <div>
                            <button class="btn-add30" onclick="add30Seconds(${index})">+30秒</button>
                            設分: <input type="number" value="${currentMinSetting}" min="1" style="width: 50px; padding: 5px;" onchange="updateReadyTime(${index}, this.value)"> 
                            <button class="btn-delete" onclick="deleteReady(${index})">手動刪除</button>
                        </div>
                    </li>
                `;
            });
        }

        const thumb = document.getElementById('slideThumb');
        const track = document.getElementById('slideTrack');
        let isDragging = false;
        let startX = 0;

        function resetSlider() {
            thumb.style.left = '0px';
            thumb.style.background = '#28a745';
        }

        thumb.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            let diff = e.clientX - startX;
            let maxDist = track.clientWidth - thumb.clientWidth;
            if (diff < 0) diff = 0;
            if (diff > maxDist) diff = maxDist;
            thumb.style.left = diff + 'px';

            if (diff >= maxDist - 5) {
                isDragging = false;
                confirmMoveToReady();
            }
        });

        window.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                resetSlider();
            }
        });

        thumb.addEventListener('touchstart', (e) => {
            isDragging = true;
            startX = e.touches[0].clientX;
        });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            let diff = e.touches[0].clientX - startX;
            let maxDist = track.clientWidth - thumb.clientWidth;
            if (diff < 0) diff = 0;
            if (diff > maxDist) diff = maxDist;
            thumb.style.left = diff + 'px';

            if (diff >= maxDist - 5) {
                isDragging = false;
                confirmMoveToReady();
            }
        });

        window.addEventListener('touchend', () => {
            if (isDragging) {
                isDragging = false;
                resetSlider();
            }
        });

        setInterval(() => {
            const data = getData();
            const now = Date.now();

            if (data.ready && data.ready.length > 0) {
                const filteredReady = data.ready.filter(item => item.expireTime > now);
                if (filteredReady.length !== data.ready.length) {
                    data.ready = filteredReady;
                    localStorage.setItem('queueData', JSON.stringify(data));
                }
            }
            renderAdmin();
        }, 1000);

        renderAdmin();
    </script>
</body>
</html>
