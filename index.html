<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>取餐叫號系統 - 入口網</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #FBF9F5;
            color: #2C3E50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #FFFFFF;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.04);
            border: 1px solid #EAE6DF;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #4A3B32;
        }
        p {
            color: #7F8C8D;
            margin-bottom: 30px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 12px;
            box-sizing: border-box;
            transition: transform 0.1s;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-display {
            background-color: #E8F5E9;
            color: #1B5E20;
            border: 2px solid #66BB6A;
        }
        .btn-admin {
            background-color: #E3F2FD;
            color: #0D47A1;
            border: 2px solid #42A5F5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>取餐叫號系統</h1>
        <p>請選擇您要進入的頁面</p>
        <a href="display.html" class="btn btn-display" target="_blank">📺 開啟前台顯示螢幕</a>
        <a href="admin.html" class="btn btn-admin" target="_blank">⚙️ 開啟後台控制面板</a>
    </div>
</body>
</html>
